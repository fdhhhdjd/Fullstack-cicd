# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Build and Deploy Source for Docker

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: [self-hosted]

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
    - name: Created file .env
      run: |
       touch .env
       echo "PORT=${{ secrets.PORT }}" > .env
    - name: Build docker image
      run: docker build -t ${{ secrets.DOCKER_HUB_CLASS }} .
    - name: Push image to docker registry
      run: docker push ${{ secrets.DOCKER_HUB_CLASS }}

  deploy:
    needs: build
    runs-on: [Linux]
    steps:
    - name: Run file docker-compose and send Telegram notification
      run: |
        docker-compose -f docker-compose.yml up -d --build
        # Gửi thông báo Telegram sau khi deploy thành công
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d parse_mode="Markdown" \
          -d text="✅ *Deployment Successful!*%0A• Repository: ${{ github.repository }}%0A• Branch: ${{ github.ref_name }}%0A• Commit: ${{ github.sha }}%0A• Author: ${{ github.actor }}%0A• Message: ${{ github.event.head_commit.message }}"
      

        
